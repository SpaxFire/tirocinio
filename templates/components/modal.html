<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center" hx-on::load="lockScroll()"
    onclick="if(event.target === this) closeModal()">

    <div class="bg-white rounded-xl w-full max-w-md relative max-h-[90vh] flex flex-col">

        <!-- HEADER -->
        <div class="p-6 border-b relative">
            <button onclick="closeModal()" class="absolute top-3 right-3 btn-icon-danger">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>

            <h2 class="text-lg font-semibold">Titolo</h2>
        </div>

        <!-- BODY SCROLLABILE -->
        <div class="p-6 overflow-y-auto">
            {{ content | safe }}
        </div>

    </div>
</div>
