<div id="user-widget">
    {% if current_user %}
    <div class="fixed bottom-6 left-6 bg-white shadow rounded-xl px-4 py-2 flex items-center gap-3">

        <!-- avatar -->
        <img src="{{ current_user.profile_image or '/static/images/default_avatar.png' }}"
            class="w-10 h-10 rounded-full object-cover">

        <!-- username -->
        <div class="flex flex-col">
            <span class="font-semibold text-sm">{{ current_user.username }}</span>
        </div>

        <!-- logout -->
        <button hx-post="/logout" hx-target="body" hx-swap="outerHTML" class="ml-2 text-gray-500 hover:text-red-600">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
            </svg>
        </button>

    </div>
    {% else %}
    <div class="fixed bottom-6 left-6">
        <div class="relative bg-white shadow rounded-xl px-4 py-2 flex items-center gap-3 hover:bg-gray-50 transition">

            <!-- overlay click -->
            <a hx-get="/login/modal" hx-target="#modal-container" class="absolute inset-0 z-10" aria-label="Login"></a>

            <span class="relative z-0 flex items-center gap-2">Login<svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24" fill="currentColor" class="size-6">
                    <path fill-rule="evenodd"
                        d="M7.5 3.75A1.5 1.5 0 0 0 6 5.25v13.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5V15a.75.75 0 0 1 1.5 0v3.75a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3V5.25a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3V9A.75.75 0 0 1 15 9V5.25a1.5 1.5 0 0 0-1.5-1.5h-6Zm5.03 4.72a.75.75 0 0 1 0 1.06l-1.72 1.72h10.94a.75.75 0 0 1 0 1.5H10.81l1.72 1.72a.75.75 0 1 1-1.06 1.06l-3-3a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 0Z"
                        clip-rule="evenodd" />
                </svg>
            </span>
        </div>
    </div>

    {% endif %}
</div>
