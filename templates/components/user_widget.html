<div id="user-widget">
    {% if current_user %}
    <div class="fixed bottom-6 left-6 bg-white shadow rounded-xl px-4 py-2 flex items-center gap-3">

        <!-- avatar -->
        <img src="{{ current_user.profile_image or '/static/images/default-avatar.png' }}"
            class="w-10 h-10 rounded-full object-cover">

        <!-- username -->
        <div class="flex flex-col">
            <span class="font-semibold text-sm">{{ current_user.username }}</span>
        </div>

        <!-- logout -->
        <button hx-post="/logout" hx-target="body" hx-swap="outerHTML" class="ml-2 text-gray-500 hover:text-red-600">
            ⎋
        </button>

    </div>
    {% else %}
    <div class="fixed bottom-6 left-6 bg-white shadow rounded-xl px-4 py-2 flex items-center gap-3">
        <button hx-get="/login/modal" hx-target="#modal-container">
            Login
        </button>
    </div>
    {% endif %}
</div>
