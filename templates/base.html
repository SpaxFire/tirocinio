<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="{{ url_for('static', path='/css/output.css') }}" rel="stylesheet">

    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <!-- JS personalizzato per funzionalità specifiche -->
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
    <!-- Alpine.js per visualizzazione immagini -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <title>{% block title %}Social Network{% endblock %}</title>
</head>

<body hx-boost="true" class="bg-gray-100">

    <div class="max-w-7xl mx-auto flex gap-6 mt-6">
        <div id="flash-container" class="fixed top-5 right-5 z-[9999] space-y-2">
            {% set flash = request.cookies.get("flash_message") %}
            {% if flash %}
            <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 4000)" x-show="show" x-transition
                class="msg-success">
                {{ flash }}
            </div>
            {% endif %}
        </div>

        <!-- SIDEBAR LEFT -->
        <aside id="sidebar-left" class="w-1/4 sticky top-6 h-fit">
            {% include "components/sidebar_left.html" %}
        </aside>

        <!-- CONTENUTO DINAMICO -->
        <main id="main-content" class="w-2/4" hx-history-elt>
            {% block content %}{% endblock %}
        </main>

        <!-- SIDEBAR RIGHT -->
        <aside id="sidebar-right" class="w-1/4 sticky top-6 h-fit">
            <div hx-get="/sidebar/right" hx-trigger="load" hx-swap="innerHTML">

                <div class="bg-white rounded-xl shadow p-4 text-sm text-gray-400">
                    Caricamento...
                </div>

            </div>
        </aside>
    </div>

    <!-- USER WIDGET FLOATING -->
    <div id="user-widget" class="fixed bottom-6 right-6" hx-get="/auth/user-widget" hx-trigger="load">
    </div>

    <div id="modal-container"></div>
</body>

</html>
