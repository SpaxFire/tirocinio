{% set content %}
<h2 class="text-lg font-semibold mb-4">Registrazione</h2>

<form hx-post="/register" hx-target="#form-error" hx-swap="innerHTML" class="space-y-3">

    <input name="username" placeholder="Username" class="w-full border rounded p-2">
    <input name="email" placeholder="Email" class="w-full border rounded p-2">
    <input type="password" name="password" placeholder="Password" class="w-full border rounded p-2">

    <button class="w-full bg-green-600 text-white rounded p-2">
        Registrati
    </button>

    <div id="form-error"></div>
</form>
{% endset %}

{% include "components/modal.html" with context %}
