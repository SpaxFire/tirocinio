{% for comment in comments %}
<div id="comment-{{ comment.id }}" class="flex gap-3 py-3 border-b m-2 relative group">

    <!-- FOTO PROFILO -->
    <div class="flex-shrink-0">
        <img src="{{ comment.profile_image or url_for('static', path='images/default_avatar.png') }}"
            class="w-10 h-10 rounded-full object-cover">
    </div>

    <!-- CONTENUTO -->
    <div class="flex-1">

        <!-- Header commento -->
        <div class="flex justify-between items-start">

            <div>
                <div class="flex items-center gap-2 text-sm">
                    <span class="font-semibold text-gray-800">
                        {{ comment.author }}
                    </span>
                    <span class="text-gray-400 text-xs">
                        {{ comment.created_at }}
                    </span>
                </div>
            </div>

            {% set user = current_user(request) %}
            {% if user and user.username == comment.author %}
            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">

                <!-- EDIT -->
                <button hx-get="/comments/{{ comment.id }}/edit-modal" hx-target="#modal-container" hx-swap="innerHTML"
                    hx-trigger="click consume" class="relative z-30 btn-icon transition">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.862 3.487a2.25 2.25 0 0 1 3.182 3.182L7.5 19.213l-4 1 1-4 12.362-12.362z" />
                    </svg>
                </button>

                <!-- DELETE -->
                <button hx-get="/comments/{{ comment.id }}/delete-modal" hx-target="#modal-container"
                    hx-swap="innerHTML" hx-trigger="click consume" class="relative z-30 btn-icon-danger transition">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>
                </button>

            </div>
            {% endif %}

        </div>

        <!-- Testo -->
        <p class="text-gray-700 mt-1">
            {{ comment.text }}
        </p>

    </div>
</div>
{% endfor %}
