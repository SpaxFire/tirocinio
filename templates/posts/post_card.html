<a href="/posts/{{ post.id }}" hx-target="#main-content" hx-push-url="true"
    class="block bg-white rounded-xl shadow p-4 mb-4 hover:bg-gray-50 transition">

    <div class="flex justify-between items-center">
        <span class="font-semibold text-gray-800">
            {{ post.author }}
        </span>
        <span class="text-sm text-gray-500">
            {{ post.created_at }}
        </span>
    </div>

    <p class="mt-2 text-gray-700">
        {{ post.content }}
    </p>

    {% if post.media %}
    <img src="{{ post.media[0] }}" class="mt-3 rounded-lg max-h-64 object-cover">
    {% endif %}

    <div class="flex gap-6 mt-4 text-sm text-gray-600">
        <button hx-post="/posts/{{ post.id }}/like" hx-trigger="click" hx-target="#modal-container" hx-swap="innerHTML"
            class="flex items-center gap-1">
            ❤️ {{ post.like_count }}
        </button>
        <button hx-get="/posts/{{ post.id }}/comment-form" hx-target="#modal-container" hx-swap="innerHTML"
            class="flex items-center gap-1">
            💬 {{ post.comment_count }}
        </button>
    </div>
</a>
